# Ilovaning barcha yo'nalishlari. HTTP va HTTPS server bloklari uchun umumiy —
# ikki joyda ikki xil bo'lib ketmasligi uchun bitta faylda turadi.

location /api/ {
    proxy_pass http://django;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /admin/ {
    proxy_pass http://django;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /healthz {
    proxy_pass http://django;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

# Ovoz sessiyasi WebSocket'i — uzoq muddatli ulanish.
location /ws/ {
    proxy_pass http://django;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location /static/ {
    alias /var/www/static/;
    expires 30d;
    access_log off;
}

# Shadowing videolari — admin orqali yuklanadi.
location /media/ {
    alias /var/www/media/;
    expires 7d;
    access_log off;
}

# Veb ilova (SPA). index.html keshlanmaydi — yangi deploy darhol ko'rinsin.
location = /index.html {
    root /var/www/app;
    # `expires -1` -> `Cache-Control: no-cache`. Ataylab `add_header` emas:
    # `add_header` shu blokda yuqoridagi header'larni (HSTS, X-Frame-Options)
    # bekor qilib yuborardi.
    expires -1;
}

location / {
    root /var/www/app;
    try_files $uri $uri/ /index.html;
}

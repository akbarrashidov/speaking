# Xavfsizlik header'lari — prod-http.conf va prod-ssl.conf ikkalasi ham ulaydi.
# Mustaqil veb ilova: boshqa saytlar iframe ichiga sola olmaydi (clickjacking).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Mikrofon faqat shu manzilga ruxsat etiladi, qolgan sezgir API'lar yopiq.
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

# HTTPS'gacha bo'lgan holat — IP orqali (http://167.86.122.56) ishlaydi.
#
# DIQQAT: bu rejimda brauzer mikrofonni BERMAYDI. getUserMedia() faqat xavfsiz
# kontekstda (https:// yoki localhost) ishlaydi, shuning uchun ovoz sessiyasi
# ochilmaydi. Admin panel, ro'yxatdan o'tish, kontent — hammasi ishlaydi.
#
# Domen tayyor bo'lgach:
#   bash scripts/enable-https.sh sizning-domen.uz admin@sizning-domen.uz

upstream django {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 8m;

    include /etc/nginx/snippets/security.conf;

    # Let's Encrypt HTTP-01 tekshiruvi. Sertifikat olishdan OLDIN ham ochiq
    # turishi kerak — certbot shu yo'l orqali faylni qidiradi.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    include /etc/nginx/snippets/app.conf;
}

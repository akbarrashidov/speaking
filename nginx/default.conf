upstream django {
    server web:8000;
}

# Diqqat: `$host` EMAS, `$http_host` — u portni ham saqlaydi. Django CSRF
# tekshiruvi brauzerdagi `Origin` ni `request.get_host()` bilan solishtiradi;
# port tushib qolsa (`http://localhost:8100` ↔ `http://localhost`) admin'ga
# kirishda 403 chiqadi. Shu bilan HTTP_PORT ni istalgan portga o'zgartirsa ham
# hech narsa buzilmaydi.

server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    # Mustaqil veb ilova — boshqa saytlar iframe ichiga sola olmaydi (clickjacking).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Mikrofon faqat shu manzilga ruxsat etiladi, qolgan sezgir API'lar yopiq.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # Ovoz sessiyasi WebSocket'i — uzoq muddatli ulanish.
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # Shadowing videolari — admin orqali yuklanadi.
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # Mini App (SPA)
    location / {
        root /var/www/app;
        try_files $uri $uri/ /index.html;
    }
}

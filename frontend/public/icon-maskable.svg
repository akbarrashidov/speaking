<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Speaking</title>
  <!-- Android "maskable" nishoni: fon to'liq to'ldiriladi (tizim o'zi kesadi),
       belgi esa xavfsiz doira ichida — burchaklari kesilsa ham to'lqin butun
       qoladi. Shu bois bu yerda pufak dumi yo'q: shakl tizimga tegishli. -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4361ee"/>
      <stop offset="1" stop-color="#7c5cf0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#m)"/>
  <g fill="#fff">
    <rect x="7.7" y="12.25" width="4.6" height="7.5" rx="2.3"/>
    <rect x="19.7" y="10.25" width="4.6" height="11.5" rx="2.3"/>
  </g>
  <rect x="13.7" y="8.25" width="4.6" height="15.5" rx="2.3" fill="#ffcf3d"/>
</svg>

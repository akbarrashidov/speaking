<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Speaking</title>
  <!-- Belgi qat'iy brend ranglarida: logotip mavzu bilan almashmaydi, shuning
       uchun brauzer yorlig'idagi va ilova ichidagi nishon bir xil ko'rinadi. -->
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4361ee"/>
      <stop offset="1" stop-color="#7c5cf0"/>
    </linearGradient>
  </defs>
  <!-- Nishonning o'zi gap pufagi: dumi pastda chapda. -->
  <path fill="url(#s)" d="M10 2h12a8 8 0 0 1 8 8v8a8 8 0 0 1-8 8h-5l-8 5.5 2-5.5h-1a8 8 0 0 1-8-8v-8a8 8 0 0 1 8-8z"/>
  <!-- Uch ustun — ilovaning to'lqin belgisining qotib qolgan holati. O'rtadagi
       ustun marker rangida: 16px da ham nishon ikki rangli bo'lib tanaladi. -->
  <g fill="#fff">
    <rect x="7.7" y="10.25" width="4.6" height="7.5" rx="2.3"/>
    <rect x="19.7" y="8.25" width="4.6" height="11.5" rx="2.3"/>
  </g>
  <rect x="13.7" y="6.25" width="4.6" height="15.5" rx="2.3" fill="#ffcf3d"/>
</svg>
